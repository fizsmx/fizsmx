<svg xmlns="http://www.w3.org/2000/svg" width="880" height="335" viewBox="0 0 880 335" role="img" aria-label="Polyglot Language Proficiency across all programming languages">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#38b2ac"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGradAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38b2ac"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: #38b2ac;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #81e6d9;
    }
    .lang {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .pct {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #38b2ac;
    }
    .foot {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      fill: #8b949e;
    }
    .track { fill: #161b22; stroke: #21262d; stroke-width: 1; }
    .fill-bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growBar 1.1s ease-out forwards;
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
  </style>

  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="879" height="334" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <!-- Header -->
  <text x="26" y="34" class="title">Polyglot Language &amp; Systems Proficiency</text>
  <rect x="612" y="16" width="242" height="24" rx="12" fill="#0f2933" stroke="#38b2ac" stroke-opacity="0.45" stroke-width="1"/>
  <text x="733" y="32" text-anchor="middle" class="pill-text">ALL LANGUAGES · 60+ ECOSYSTEMS</text>
  <line x1="26" y1="48" x2="854" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- LEFT COLUMN (x=26, bar width=395) -->
  <!-- 1 -->
  <circle cx="32" cy="70" r="4.5" fill="#3178c6"/>
  <text x="44" y="74" class="lang">TypeScript / JavaScript</text>
  <text x="421" y="74" text-anchor="end" class="pct">98%</text>
  <rect x="26" y="81" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="81" width="387" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- 2 -->
  <circle cx="32" cy="110" r="4.5" fill="#3776ab"/>
  <text x="44" y="114" class="lang">Python (AI · LLMs · FastAPI · Odoo)</text>
  <text x="421" y="114" text-anchor="end" class="pct">97%</text>
  <rect x="26" y="121" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="121" width="383" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- 3 -->
  <circle cx="32" cy="150" r="4.5" fill="#e34f26"/>
  <text x="44" y="154" class="lang">HTML5 / CSS3 / Sass / Tailwind</text>
  <text x="421" y="154" text-anchor="end" class="pct">98%</text>
  <rect x="26" y="161" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="161" width="387" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- 4 -->
  <circle cx="32" cy="190" r="4.5" fill="#336791"/>
  <text x="44" y="194" class="lang">SQL / PostgreSQL / PLpgSQL / MySQL</text>
  <text x="421" y="194" text-anchor="end" class="pct">96%</text>
  <rect x="26" y="201" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="201" width="379" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- 5 -->
  <circle cx="32" cy="230" r="4.5" fill="#777bb4"/>
  <text x="44" y="234" class="lang">PHP / WordPress / Laravel / Symfony</text>
  <text x="421" y="234" text-anchor="end" class="pct">95%</text>
  <rect x="26" y="241" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="241" width="375" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- 6 -->
  <circle cx="32" cy="270" r="4.5" fill="#4eaa25"/>
  <text x="44" y="274" class="lang">Bash / PowerShell / Linux Shell / Nix</text>
  <text x="421" y="274" text-anchor="end" class="pct">96%</text>
  <rect x="26" y="281" width="395" height="8" rx="4" class="track"/>
  <rect x="26" y="281" width="379" height="8" rx="4" fill="url(#barGrad)" class="fill-bar"/>

  <!-- RIGHT COLUMN (x=459, bar width=395) -->
  <!-- 7 -->
  <circle cx="465" cy="70" r="4.5" fill="#00599c"/>
  <text x="477" y="74" class="lang">C / C++ / C# / Java / Kotlin / Swift</text>
  <text x="854" y="74" text-anchor="end" class="pct">93%</text>
  <rect x="459" y="81" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="81" width="367" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- 8 -->
  <circle cx="465" cy="110" r="4.5" fill="#00add8"/>
  <text x="477" y="114" class="lang">Go / Rust / Zig / Nim / Crystal / V</text>
  <text x="854" y="114" text-anchor="end" class="pct">91%</text>
  <rect x="459" y="121" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="121" width="359" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- 9 -->
  <circle cx="465" cy="150" r="4.5" fill="#cc342d"/>
  <text x="477" y="154" class="lang">Ruby / Dart / Lua / Perl / R / Julia</text>
  <text x="854" y="154" text-anchor="end" class="pct">90%</text>
  <rect x="459" y="161" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="161" width="355" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- 10 -->
  <circle cx="465" cy="190" r="4.5" fill="#8e44ad"/>
  <text x="477" y="194" class="lang">Elixir / Erlang / Scala / Haskell / Clojure / F#</text>
  <text x="854" y="194" text-anchor="end" class="pct">89%</text>
  <rect x="459" y="201" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="201" width="351" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- 11 -->
  <circle cx="465" cy="230" r="4.5" fill="#38bdf8"/>
  <text x="477" y="234" class="lang">Solidity / WebAssembly / Move / Cairo / CUDA</text>
  <text x="854" y="234" text-anchor="end" class="pct">90%</text>
  <rect x="459" y="241" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="241" width="355" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- 12 -->
  <circle cx="465" cy="270" r="4.5" fill="#f59e0b"/>
  <text x="477" y="274" class="lang">Assembly / COBOL / Fortran / Verilog / VHDL / Lisp</text>
  <text x="854" y="274" text-anchor="end" class="pct">88%</text>
  <rect x="459" y="281" width="395" height="8" rx="4" class="track"/>
  <rect x="459" y="281" width="347" height="8" rx="4" fill="url(#barGradAlt)" class="fill-bar"/>

  <!-- Footer -->
  <line x1="26" y1="304" x2="854" y2="304" stroke="#21262d" stroke-width="1"/>
  <text x="440" y="322" text-anchor="middle" class="foot">Polyglot hands-on experience across all programming languages &amp; paradigms (public, private &amp; local systems)</text>
</svg>
